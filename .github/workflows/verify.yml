name: Verify public research evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test]" numpy==1.26.4 matplotlib==3.9.2
      - run: python scripts/verify_public_release.py
      - run: python -m pytest -q
